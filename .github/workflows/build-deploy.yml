name: Build and deploy

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  APP_NAME: applcd1602_image_generator

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_version: "6.10.2"
            qt_arch: win64_mingw
            artifact_name: lcd1602-image-generator-windows
            archive_name: lcd1602-image-generator-windows.zip
          - name: Linux
            os: ubuntu-24.04
            qt_version: "6.8.3"
            qt_arch: gcc_64
            artifact_name: lcd1602-image-generator-linux
            archive_name: lcd1602-image-generator-linux.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Qt for Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Install Qt for Linux
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Add Qt MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS "mingw1310_64\bin"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_C_COMPILER=$mingw\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER=$mingw\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER="${{ env.CMAKE_C_COMPILER }}"
          -DCMAKE_CXX_COMPILER="${{ env.CMAKE_CXX_COMPILER }}"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Install and deploy
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}/package"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive_name }} -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
